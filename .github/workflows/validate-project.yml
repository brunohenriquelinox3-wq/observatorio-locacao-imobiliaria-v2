name: Validate CRM and Claude package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
    - cron: '43 15 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate Claude package
        run: python3 .claude/scripts/validate_package.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Netlify build
        run: pnpm build:netlify
      - name: Diff and artifact hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f dist/public/index.html
          test -f dist/netlify-functions-check/api.js
          test ! -e .netlify
          ! find . -type f \( -name '.env*' -o -name '*.pem' -o -name '*.key' \) -not -path './node_modules/*' | grep -q .
