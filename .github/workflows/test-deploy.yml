name: Ambiente de teste · validação e deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 09:17 e 17:17 no horário de São Paulo (UTC-03), fora do início exato da hora.
    - cron: "17 12 * * *"
    - cron: "17 20 * * *"

permissions:
  contents: read

concurrency:
  group: netlify-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipagem, testes e build Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências com lockfile
        run: pnpm install --frozen-lockfile

      - name: Verificar tipagem
        run: pnpm check

      - name: Executar testes
        run: pnpm test

      - name: Validar build de funções e frontend Netlify
        run: pnpm build:netlify

  deploy-test:
    name: Publicar preview de teste no Netlify
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências com lockfile
        run: pnpm install --frozen-lockfile

      - name: Conferir segredos de deploy sem exibi-los
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "NETLIFY_AUTH_TOKEN não configurado."; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "NETLIFY_SITE_ID não configurado."; exit 1; }

      - name: Publicar somente preview/rascunho de teste
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          pnpm exec netlify deploy \
            --build \
            --alias=crm-teste \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Teste automático · $GITHUB_SHA"

      - name: Registrar referência do commit
        run: echo "Preview de teste gerado para $GITHUB_SHA; nenhum deploy de produção foi solicitado."
